# RCGM production reverse-proxy vhost, matching the pattern already used by
# the other apps on this VPS (system nginx + certbot, one file per domain in
# /etc/nginx/sites-available, symlinked into sites-enabled).
#
# The Next.js "web" container is the only upstream nginx needs to know about
# — its own /app/api/[...path]/route.ts proxy already forwards /api/* to the
# FastAPI "api" container internally, so there is no separate API vhost.
#
# --- Deployment steps (NOT run automatically — do this once DNS resolves) ---
#   1. In Cloudflare DNS for reguluscompliance.com, add:
#        A   rcgm   217.15.165.57   (DNS only / grey-cloud, so certbot's
#                                     HTTP-01 challenge reaches this host)
#   2. Wait for it to resolve: dig +short rcgm.reguluscompliance.com
#   3. sudo cp infrastructure/nginx/rcgm.reguluscompliance.com.conf \
#            /etc/nginx/sites-available/rcgm.reguluscompliance.com
#   4. sudo ln -s /etc/nginx/sites-available/rcgm.reguluscompliance.com \
#                 /etc/nginx/sites-enabled/rcgm.reguluscompliance.com
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. sudo certbot --nginx -d rcgm.reguluscompliance.com
#      (this rewrites this file in place to add the TLS server block +
#      HTTP->HTTPS redirect, exactly as it did for the other domains here)
#   7. Set WEB_PORT/API_PORT in the production .env, bring the stack up with
#      `docker compose up -d --build`, and confirm https://rcgm.reguluscompliance.com
#      loads the login page before telling anyone the domain is live.

server {
    server_name rcgm.reguluscompliance.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 15m;
    }

    listen 80;
    listen [::]:80;
}
